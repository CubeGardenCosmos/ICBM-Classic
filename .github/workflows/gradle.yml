name: Main Workflow

on: [push]

jobs:
  build:
    name: Gradle Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '25'
    - name: Chmod gradlew
      run: chmod a+x ./gradlew
    - name: Build with Gradle
      run: ./gradlew build
