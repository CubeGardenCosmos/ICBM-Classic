plugins {
    id 'java'
    id 'net.fabricmc.fabric-loom' version '1.18.3'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(project.java_version as int) }
    withSourcesJar()
}

loom {
    splitEnvironmentSourceSets()
    mods {
        icbmclassic {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    mavenCentral()
    maven { url "https://maven.fabricmc.net/" }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "icbmclassic-test"
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
    // S2.06: models and block states need client classes, so the data generator runs against the client
    // source set. addToResources puts src/main/generated on the main resources, which also makes the
    // generated files readable from the GameTests.
    configureDataGeneration {
        client = true
        addToResources = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation "teamreborn:energy:${project.tr_energy_version}"
    include "teamreborn:energy:${project.tr_energy_version}"

    compileOnly "org.projectlombok:lombok:${project.lombok_version}"
    annotationProcessor "org.projectlombok:lombok:${project.lombok_version}"
    clientCompileOnly "org.projectlombok:lombok:${project.lombok_version}"
    clientAnnotationProcessor "org.projectlombok:lombok:${project.lombok_version}"

    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    gametestCompileOnly "org.projectlombok:lombok:${project.lombok_version}"
    gametestAnnotationProcessor "org.projectlombok:lombok:${project.lombok_version}"
}

test { useJUnitPlatform() }

/**
 * S2.10: the English language file has two sources (i18n.md §4), both would land on the same path in the
 * jar. The generated one holds the names of the registered content (datagen), the hand written one the
 * migrated GUI/message/tooltip text (scripts/migrate_lang.py). They are merged into one file here; a key
 * that both define with a different value fails the build.
 */
def mergedLangDir = layout.buildDirectory.dir("generated/lang")
def mergedLangFile = mergedLangDir.map { it.file("assets/icbmclassic/lang/en_us.json") }
tasks.register('mergeLang') {
    def generatedLang = file("src/main/generated/assets/icbmclassic/lang/en_us.json")
    def handwrittenLang = file("src/main/resources/assets/icbmclassic/lang/en_us.json")
    inputs.files(generatedLang, handwrittenLang)
    outputs.file(mergedLangFile)
    doLast {
        def slurper = new groovy.json.JsonSlurper()
        def merged = new TreeMap()
        [generatedLang, handwrittenLang].each { source ->
            if (!source.exists()) {
                if (source == handwrittenLang) {
                    throw new GradleException("lang source is missing: " + source)
                }
                // the generated names come from runDatagen; on a tree that never ran it, merge what exists
                // (LangGameTest fails when the generated keys are not in the jar)
                logger.lifecycle("mergeLang: " + source + " is missing, run runDatagen to generate it")
                return
            }
            def parsed = slurper.parse(source, "UTF-8")
            if (!(parsed instanceof Map)) {
                throw new GradleException("lang file is not a JSON object: " + source)
            }
            parsed.each { key, value ->
                if (!(value instanceof String)) {
                    throw new GradleException("lang value is not a string: " + key + " in " + source)
                }
                if (merged.containsKey(key) && merged[key] != value) {
                    throw new GradleException("lang key conflict: " + key)
                }
                merged[key] = value
            }
        }
        def target = mergedLangFile.get().asFile
        target.parentFile.mkdirs()
        target.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(merged)) + "\n", "UTF-8")
    }
}

// the two en_us.json sources are dropped from the resources (both would end up on the same jar path),
// mergeLang puts the single merged file back in below
sourceSets.main.resources.exclude "assets/icbmclassic/lang/en_us.json"

processResources {
    dependsOn 'mergeLang'
    from(mergedLangDir)
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = project.java_version as int
}

tasks.named('sourcesJar') {
    // same rule as processResources: the two en_us.json sources are replaced by the merged file
    dependsOn 'mergeLang'
    mustRunAfter 'runDatagen'
    from(mergedLangDir)
}

jar {
    from("LICENSE.md") { rename { "${it}_${project.base.archivesName.get()}" } }
}

tasks.register('installLocalGitHook', Copy) {
    from new File(rootProject.rootDir, 'scripts/commit-msg')
    into { new File(rootProject.rootDir, '.git/hooks') }
    filePermissions { unix(0775) }
}
tasks.named('build') { dependsOn 'installLocalGitHook' }
